<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Overpass+Mono:wght@700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_base.css"><style>
.h{position:absolute;left:48px;right:48px;top:92px;z-index:4;font:700 84px/0.95 'Roboto Mono',monospace;letter-spacing:-.04em;color:#eafff7;text-transform:uppercase;text-shadow:0 0 26px rgba(143,245,210,.3)}
.h .s{color:#a892f4;font-family:'Overpass Mono',monospace}.h .g{color:#8ff5d2}
.days{position:absolute;left:48px;right:48px;top:330px;display:grid;grid-template-columns:repeat(14,1fr);gap:8px;z-index:4}
.d{position:relative;height:118px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 18%,#0b0d0c);padding:8px 9px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 0 18px color-mix(in srgb,var(--c) 25%,transparent)}
.d .w{font-size:14px;color:#4f7d6c;text-transform:uppercase}.d .n{font:700 30px/1 'Roboto Mono';color:#eafff7}
.d .m{position:absolute;top:-14px;left:-1px;font:700 13px 'Roboto Mono';background:var(--c);color:#000;padding:1px 6px}
.lg{position:absolute;left:48px;right:48px;top:474px;display:flex;justify-content:space-between;font-size:15px;color:#4f7d6c;z-index:4}
.lg i{display:inline-block;width:12px;height:12px;background:var(--c);margin-right:8px;vertical-align:-1px}
.note{color:#fb9f44}
</style></head><body><div class="stage"><div class="ascii" id="a"></div>
<div class="top"><span>gnofy :: build.log</span><span class="t" style="border-color:#fb9f44;color:#fb9f44">orientative reconstruction</span></div>
<div class="h">From <span class="s">.sol</span> to <span class="g">.gno</span><br>in 14 days<span class="blink" style="height:.8em"></span></div>
<div class="days" id="days"></div>
<div class="lg" id="lg"></div>
<div class="bar"><span>13 nov → 26 nov 2026 · 5 phases · v0.1 → v0.4</span><span><b>gnofy.xyz/timeline</b></span></div>
<div class="scan"></div><div class="vig"></div></div>
<script src="_ascii.js"></script>
<script>
const C={1:'#a892f4',2:'#7fb2ff',3:'#60ab96',4:'#fb9f44',5:'#8ff5d2'};
const D=[[1,'fri','13'],[1,'sat','14'],[1,'sun','15','v0.1'],[2,'mon','16'],[2,'tue','17'],[2,'wed','18'],[2,'thu','19','v0.2'],[3,'fri','20'],[3,'sat','21'],[3,'sun','22','v0.3'],[4,'mon','23'],[4,'tue','24','v0.4'],[5,'wed','25'],[5,'thu','26']];
document.getElementById('days').innerHTML=D.map(([p,w,n,m])=>`<div class="d" style="--c:${C[p]}">${m?`<span class="m">${m}</span>`:''}<span class="w">${w}</span><span class="n">${n}</span></div>`).join('');
const N={1:'frontend',2:'IR + codegen',3:'inheritance + idiomatic',4:'AI + lockfile',5:'hardening'};
document.getElementById('lg').innerHTML=Object.keys(C).map(k=>`<span style="--c:${C[k]}"><i></i>F${k} ${N[k]}</span>`).join('');
</script></body></html>
